<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Pineapple</title>
<meta name="description" content="Pixel Pineapple — small indie games for Android.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #fff8ec; --card: #ffffff; --text: #2b2118; --muted: #7a6a58; --accent: #e8743b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1712; --card: #2a221b; --text: #f6ecdf; --muted: #b9a892; --accent: #ff9a5c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
  header img { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 2rem; }
  header p { margin: 0; color: var(--muted); }
  h2 { font-size: 1.1rem; margin: 32px 0 12px; }
  .game { background: var(--card); border-radius: 16px; padding: 16px 20px; margin-bottom: 12px; }
  .game h3 { margin: 0 0 4px; }
  .game p { margin: 0 0 8px; color: var(--muted); }
  a { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.png" alt="">
    <div>
      <h1>Pixel Pineapple</h1>
      <p>Small indie games for Android.</p>
    </div>
  </header>

  <h2>Games</h2>
  <div class="game">
    <h3>Puzzle My Heart</h3>
    <p>A picture puzzle with a light dating story.</p>
    <a href="https://play.google.com/store/apps/details?id=com.puzzle.my.heart_">Google Play</a> ·
    <a href="https://telegra.ph/Puzzle-My-Heart--Privacy-Policy-09-25">Privacy policy</a>
  </div>
  <div class="game">
    <h3>Block Boom</h3>
    <p>A block puzzle: fill rows and columns, clear lines, build combos.</p>
    <a href="https://play.google.com/store/apps/details?id=com.block_boom">Google Play</a> ·
    <a href="https://claude.ai/artifact/1hu7Te3p3Sn63cAh4vVLqy">Privacy policy</a>
  </div>

  <footer>
    Contact: <a href="mailto:pixelpineapplegames@gmail.com">pixelpineapplegames@gmail.com</a>
  </footer>
</main>
</body>
</html>
